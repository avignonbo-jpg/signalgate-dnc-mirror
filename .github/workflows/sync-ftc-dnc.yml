name: Sync FTC DNC Mirror

on:
  schedule:
    # Every 6 hours. DNC complaint data doesn't need to be fresher than this —
    # tune down if the FTC dataset updates less often than that in practice.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dnc-mirror-pulse
        uses: actions/checkout@v4
        with:
          ref: dnc-mirror-pulse

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch, validate, and publish FTC DNC snapshot
        env:
          FTC_API_KEY: ${{ secrets.FTC_API_KEY }}
        run: python3 scripts/sync_ftc_dnc.py

      - name: Sign finalized snapshot and publish manifest
        env:
          DNC_SIGNING_PRIVATE_KEY: ${{ secrets.DNC_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/dnc-signing-key.pem"
          der_file="$RUNNER_TEMP/dnc-signing-key.der"
          sig_file="$RUNNER_TEMP/dnc-numbers.json.sig.der"
          trap 'rm -f "$key_file" "$der_file" "$sig_file"' EXIT

          if [[ "$DNC_SIGNING_PRIVATE_KEY" == *"BEGIN"* ]]; then
            printf '%s' "$DNC_SIGNING_PRIVATE_KEY" > "$key_file"
          else
            printf '%s' "$DNC_SIGNING_PRIVATE_KEY" | base64 --decode > "$der_file"
            openssl pkey -inform DER -in "$der_file" -out "$key_file"
          fi

          openssl dgst -sha256 -sign "$key_file" -out "$sig_file" dnc-numbers.json
          snapshot_hash="$(sha256sum dnc-numbers.json | cut -d ' ' -f 1)"
          signature_b64="$(base64 --wrap=0 "$sig_file")"
          signed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          python3 - "$snapshot_hash" "$signature_b64" "$signed_at" <<'PY'
          import json
          import sys

          manifest = {
              "algorithm": "SHA256withECDSA",
              "sha256Hex": sys.argv[1],
              "signatureB64": sys.argv[2],
              "signedAt": sys.argv[3],
          }
          with open("dnc-numbers.json.manifest.json", "w", encoding="utf-8", newline="") as f:
              json.dump(manifest, f, separators=(",", ":"), sort_keys=True)
              f.write("\\n")
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "signalgate-dnc-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dnc-numbers.json dnc-numbers.json.manifest.json
          if git diff --cached --quiet; then
            echo "No change in published data — skipping commit."
          else
            git commit -m "Sync FTC DNC snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin dnc-mirror-pulse
          fi
